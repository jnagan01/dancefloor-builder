name: Weekly synthetic break tests
on:
  schedule:
    - cron: '0 3 * * 2'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      seed:
        description: Optional exact uint32 seed (blank uses Central Tuesday YYYYMMDD)
        default: ''
        type: string
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      WEEKLY_SEED: ${{ inputs.seed || '' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Initialize interruption evidence
        run: python3 .github/weekly/run_tests.py --initialize
      - name: Frozen root install
        run: bun install --frozen-lockfile
      - name: Frozen desktop install
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: All bounded synthetic suites
        run: python3 .github/weekly/run_tests.py
      - name: Persist structured outcomes even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-synthetic-results
          path: test-results/weekly/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist synthetic diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-synthetic-diagnostics
          path: |
            test-results/weekly/
            test-results/native/
            test-results/native-offline/
          if-no-files-found: error
          retention-days: 30