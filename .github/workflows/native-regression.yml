name: Read-only native regressions
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'desktop/**', 'package.json', 'bun.lock', 'bunfig.toml', 'vite.config.ts', 'tsconfig.json', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'desktop/**', 'package.json', 'bun.lock', 'bunfig.toml', 'vite.config.ts', 'tsconfig.json', '.github/workflows/**']
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Frozen root install
        run: bun install --frozen-lockfile
      - name: Frozen desktop install
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Full regression suite
        run: bunx vitest run
      - name: Actual isolated Electron flows and artifacts
        run: node tests/native/run.mjs
      - name: Offline workspace Electron flows (network denied, fenced profiles)
        run: node tests/native/offline.mjs
      - name: Synthetic diagnostics only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: isolated-native-diagnostics
          path: |
            test-results/native/
            test-results/native-offline/
          if-no-files-found: ignore
