name: Read-only native regressions
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      runner:
        description: Mac runner (Intel fallback when Apple Silicon capacity is constrained)
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'desktop/**', 'package.json', 'bun.lock', 'bunfig.toml', 'vite.config.ts', 'tsconfig.json', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'desktop/**', 'package.json', 'bun.lock', 'bunfig.toml', 'vite.config.ts', 'tsconfig.json', '.github/workflows/**']
permissions:
  contents: read
jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Frozen root install
        run: bun install --frozen-lockfile
      - name: Isolate build configuration from committed project settings
        run: |
          rm -f .env .env.local .env.production .env.production.local .env.development .env.development.local
          cat > .env.production <<'EOF'
          VITE_SUPABASE_URL=http://127.0.0.1:9
          VITE_SUPABASE_PUBLISHABLE_KEY=synthetic-build-only
          VITE_SUPABASE_PROJECT_ID=synthetic-build-only
          SUPABASE_URL=http://127.0.0.1:9
          SUPABASE_PUBLISHABLE_KEY=synthetic-build-only
          EOF
      - name: TypeScript no-emit check (frozen compiler)
        run: bun node_modules/typescript/bin/tsc --noEmit --project tsconfig.json
      - name: Production build (no deployment or providers)
        if: ${{ !cancelled() }}
        env:
          NODE_ENV: production
        run: bun run build
      - name: Verify production client excludes relay secrets
        if: ${{ !cancelled() }}
        run: node scripts/check-diagnostic-client.mjs .output/public
  regression:
    # Push, pull request, and reusable release checks retain Apple Silicon.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'macos-15' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Frozen root install
        run: bun install --frozen-lockfile
      - name: Frozen desktop install
        working-directory: desktop
        # npm ci: honors the audited package-lock nested overrides and then explicitly runs Electron 43's checksum-verified binary download (it has no postinstall).
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
          node verify-install.cjs
      - name: Full regression suite
        run: bunx vitest run
      - name: Actual isolated Electron flows and artifacts
        run: node tests/native/run.mjs
      - name: Offline workspace Electron flows (network denied, fenced profiles)
        run: node tests/native/offline.mjs && node tests/native/offline-ui-race.mjs && node tests/native/prep.mjs
      - name: Synthetic diagnostics only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: isolated-native-diagnostics
          path: |
            test-results/native/
            test-results/native-offline/
          if-no-files-found: ignore
