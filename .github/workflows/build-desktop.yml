name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon runner

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Make the app icon
        working-directory: desktop
        run: |
          set -e
          mkdir -p build/icon.iconset
          SRC=build/icon-source.png
          for size in 16 32 64 128 256 512; do
            sips -z $size $size "$SRC" --out "build/icon.iconset/icon_${size}x${size}.png"
            sips -z $((size*2)) $((size*2)) "$SRC" --out "build/icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
          rm -rf build/icon.iconset

      - name: Install build tools
        working-directory: desktop
        run: npm install

      - name: Check signing secrets are present
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "MISSING: $name"
              missing=1
            else
              echo "OK: $name (length ${#value})"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "One or more signing secrets are empty. Add them under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Build the installer
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish never

      - name: Save the installer
        uses: actions/upload-artifact@v6
        with:
          name: DancefloorBuilder-macOS-AppleSilicon
          path: desktop/release/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
