name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon runner

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Make the app icon
        working-directory: desktop
        run: |
          set -e
          mkdir -p build/icon.iconset
          SRC=build/icon-source.png
          for size in 16 32 64 128 256 512; do
            sips -z $size $size "$SRC" --out "build/icon.iconset/icon_${size}x${size}.png"
            sips -z $((size*2)) $((size*2)) "$SRC" --out "build/icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
          rm -rf build/icon.iconset

      - name: Install build tools
        working-directory: desktop
        run: npm install

      - name: Build the installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --arm64 --publish never

      - name: Save the installer
        uses: actions/upload-artifact@v4
        with:
          name: DancefloorBuilder-macOS-AppleSilicon
          path: desktop/release/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
