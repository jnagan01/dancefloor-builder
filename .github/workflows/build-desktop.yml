name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  regression:
    uses: ./.github/workflows/native-regression.yml
    permissions:
      contents: read

  build-mac:
    needs: regression
    runs-on: macos-15 # Apple Silicon runner

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Make the app icon
        working-directory: desktop
        run: |
          set -e
          mkdir -p build/icon.iconset
          SRC=build/icon-source.png
          node verify-icon.cjs "$SRC" 1024
          for size in 16 32 64 128 256 512; do
            sips -z $size $size "$SRC" --out "build/icon.iconset/icon_${size}x${size}.png"
            sips -z $((size*2)) $((size*2)) "$SRC" --out "build/icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
          iconutil -c iconset build/icon.icns -o build/verified.iconset
          node verify-icon.cjs build/verified.iconset/icon_512x512@2x.png 1024
          rm -rf build/verified.iconset
          rm -rf build/icon.iconset

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install build tools
        working-directory: desktop
        # npm ci: honors the audited package-lock nested overrides and then explicitly runs Electron 43's checksum-verified binary download (it has no postinstall).
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
          node verify-install.cjs

      - name: Stamp the build with its release tag
        id: stamp
        working-directory: desktop
        run: |
          node release-version.cjs

      - name: Check signing secrets are present
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "MISSING: $name"
              missing=1
            else
              echo "OK: $name (length ${#value})"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "One or more signing secrets are empty. Add them under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Build the installer
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish never

      - name: Verify signed ZIP, DMG, and coherent update feed
        working-directory: desktop
        run: |
          set -euo pipefail
          node verify-release.cjs
          mkdir -p "$RUNNER_TEMP/update-zip"
          ditto -x -k release/*.zip "$RUNNER_TEMP/update-zip"
          APP="$RUNNER_TEMP/update-zip/SetArchitect.app"
          ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")
          case "$ICON" in *.icns) ;; *) ICON="$ICON.icns" ;; esac
          iconutil -c iconset "$APP/Contents/Resources/$ICON" -o "$RUNNER_TEMP/packaged.iconset"
          node verify-icon.cjs "$RUNNER_TEMP/packaged.iconset/icon_512x512@2x.png" 1024
          bash verify-mac-app.sh "$APP" "$RUNNER_TEMP/zip-app-signature.log"
          # electron-builder notarizes/staples the inner app, not the DMG wrapper.
          # Keep all verification read-only so feed hashes still describe the exact upload bytes.
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/icon-dmg" release/*.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/icon-dmg"' EXIT
          DMG_APP="$RUNNER_TEMP/icon-dmg/SetArchitect.app"
          bash verify-mac-app.sh "$DMG_APP" "$RUNNER_TEMP/dmg-app-signature.log"
          cmp "$APP/Contents/Resources/$ICON" "$RUNNER_TEMP/icon-dmg/SetArchitect.app/Contents/Resources/$ICON"
          VERSION=$(node -p "require('./package.json').version")
          for PACKAGE_APP in "$APP" "$DMG_APP"; do
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PACKAGE_APP/Contents/Info.plist")" = "$VERSION"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PACKAGE_APP/Contents/Info.plist")" = 'com.exceptionalentertainment.dancefloorbuilder'
          done
          test "${{ steps.stamp.outputs.tag }}" = "v$VERSION"
          hdiutil detach "$RUNNER_TEMP/icon-dmg"
          trap - EXIT

      - name: Save the installer
        uses: actions/upload-artifact@v6
        with:
          name: DancefloorBuilder-macOS-AppleSilicon
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest-mac.yml
            desktop/release/*.blockmap
          if-no-files-found: error

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.stamp.outputs.tag }}" desktop/release/*.dmg desktop/release/*.zip desktop/release/latest-mac.yml desktop/release/*.blockmap \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dancefloor Builder ${{ steps.stamp.outputs.tag }}" \
            --latest \
            --notes "Automated build ${{ steps.stamp.outputs.tag }}"

