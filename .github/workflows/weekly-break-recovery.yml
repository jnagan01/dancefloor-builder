name: Weekly hosted runner recovery
on:
  workflow_run:
    workflows: [Weekly synthetic break tests]
    types: [completed]
  schedule:
    - cron: '23 3,4,5,6 * * 2'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect retry eligibility without starting a job
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: weekly-synthetic-recovery
  cancel-in-progress: false
jobs:
  recover:
    # Privileged completion handling never checks out a triggering run or PR.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Retry only an unallocated hosted Mac (at most two retries)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          WEEKLY_RECOVERY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python3 .github/weekly/recover.py
      - name: Persist recovery decision
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-recovery-decision
          path: test-results/weekly-recovery/decision.json
          if-no-files-found: error
          retention-days: 30
